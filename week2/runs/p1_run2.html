<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Lunch Menu</title>
  <style>
    :root {
      --ink: #18312f;
      --muted: #6c817c;
      --cream: #fffaf0;
      --paper: rgba(255, 255, 255, 0.8);
      --coral: #f26b5e;
      --yellow: #ffd166;
      --mint: #b8e0d2;
      --shadow: 0 24px 70px rgba(45, 74, 68, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 209, 102, 0.55), transparent 25rem),
        radial-gradient(circle at 90% 85%, rgba(184, 224, 210, 0.7), transparent 28rem),
        var(--cream);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .app {
      width: min(100%, 980px);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--coral);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 18px auto 0;
      max-width: 500px;
    }

    .card {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      min-height: 470px;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .visual {
      min-height: 360px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      background: var(--mint);
      overflow: hidden;
    }

    .visual::before,
    .visual::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      z-index: -1;
    }

    .visual::before {
      width: 310px;
      height: 310px;
      background: rgba(255, 255, 255, 0.42);
      top: -85px;
      left: -90px;
    }

    .visual::after {
      width: 240px;
      height: 240px;
      background: rgba(242, 107, 94, 0.2);
      bottom: -100px;
      right: -75px;
    }

    .emoji {
      font-size: clamp(8rem, 18vw, 13rem);
      line-height: 1;
      filter: drop-shadow(0 18px 12px rgba(24, 49, 47, 0.15));
      transform: rotate(-7deg);
      user-select: none;
      animation: appear 420ms ease-out;
    }

    .content {
      padding: clamp(30px, 6vw, 64px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .label {
      color: var(--coral);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .dish-name {
      margin: 10px 0 12px;
      font-size: clamp(2.5rem, 6vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    .description {
      color: var(--muted);
      line-height: 1.65;
      margin: 0 0 30px;
      max-width: 390px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 16px 25px;
      color: #fff;
      background: var(--coral);
      box-shadow: 0 10px 20px rgba(242, 107, 94, 0.28);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    button:hover {
      background: #df584e;
      box-shadow: 0 14px 26px rgba(242, 107, 94, 0.35);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 4px solid rgba(242, 107, 94, 0.28);
      outline-offset: 4px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.78rem;
      margin: 15px 0 0;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 18px;
    }

    .changing .emoji {
      animation: bounce 420ms ease-in-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px) rotate(-12deg) scale(0.86);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(-7deg) scale(1);
      }
    }

    @keyframes bounce {
      0% { transform: rotate(-7deg) scale(1); }
      45% { transform: rotate(6deg) scale(1.14); }
      100% { transform: rotate(-7deg) scale(1); }
    }

    @media (max-width: 700px) {
      body {
        padding: 16px;
      }

      .card {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .visual {
        min-height: 260px;
      }

      .emoji {
        font-size: 8rem;
      }

      .content {
        padding: 34px 28px 38px;
        align-items: center;
        text-align: center;
      }

      .description {
        margin-bottom: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">No more lunch dilemmas</p>
      <h1>What's for lunch?</h1>
      <p class="subtitle">Let chance serve up something delicious.</p>
    </header>

    <section class="card" id="menuCard" aria-live="polite">
      <div class="visual">
        <div class="emoji" id="dishEmoji" role="img" aria-label="Pizza">🍕</div>
      </div>

      <div class="content">
        <span class="label">Today's suggestion</span>
        <h2 class="dish-name" id="dishName">Pizza</h2>
        <p class="description" id="dishDescription">
          A universally loved classic with a crispy crust and your favorite toppings.
        </p>
        <button id="generateButton" type="button">Pick my lunch <span aria-hidden="true">↗</span></button>
        <p class="hint">Press the button for another idea.</p>
      </div>
    </section>

    <footer class="footer">Made for indecisive appetites.</footer>
  </main>

  <script>
    const dishes = [
      {
        name: "Pizza",
        emoji: "🍕",
        description: "A universally loved classic with a crispy crust and your favorite toppings."
      },
      {
        name: "Burger",
        emoji: "🍔",
        description: "A juicy, satisfying stack of comfort between two toasted buns."
      },
      {
        name: "Tacos",
        emoji: "🌮",
        description: "Crispy or soft shells packed with bold flavors and fresh toppings."
      },
      {
        name: "Sushi",
        emoji: "🍣",
        description: "Elegant bites of seasoned rice and fresh ingredients, rolled to perfection."
      },
      {
        name: "Ramen",
        emoji: "🍜",
        description: "A warm, slurpable bowl of noodles swimming in a deeply savory broth."
      },
      {
        name: "Curry Rice",
        emoji: "🍛",
        description: "Comforting rice covered in a fragrant, richly spiced curry sauce."
      },
      {
        name: "Spaghetti",
        emoji: "🍝",
        description: "Long strands of pasta tossed in a flavorful sauce for an easy classic."
      },
      {
        name: "Green Salad",
        emoji: "🥗",
        description: "A fresh, colorful bowl of crisp greens and vibrant vegetables."
      },
      {
        name: "Sandwich",
        emoji: "🥪",
        description: "A versatile handheld lunch layered with fillings, crunch, and creamy goodness."
      },
      {
        name: "Burrito",
        emoji: "🌯",
        description: "A hearty flour tortilla wrapped around a satisfying mix of fillings."
      },
      {
        name: "Dumplings",
        emoji: "🥟",
        description: "Tender parcels filled with savory goodness and ready for dipping."
      },
      {
        name: "Rice Ball",
        emoji: "🍙",
        description: "A simple Japanese favorite: seasoned rice formed into a delicious handheld snack."
      },
      {
        name: "Bento",
        emoji: "🍱",
        description: "A beautifully arranged lunch box with a little bit of everything."
      },
      {
        name: "Waffle",
        emoji: "🧇",
        description: "A golden, crisp-edged treat that works for lunch when you feel playful."
      },
      {
        name: "Pancakes",
        emoji: "🥞",
        description: "Fluffy, stackable comfort food for a lunch that breaks the rules."
      },
      {
        name: "Hot Pot",
        emoji: "🍲",
        description: "A warm bowl of simmered ingredients that feels like a hug at lunchtime."
      }
    ];

    const menuCard = document.getElementById("menuCard");
    const dishEmoji = document.getElementById("dishEmoji");
    const dishName = document.getElementById("dishName");
    const dishDescription = document.getElementById("dishDescription");
    const generateButton = document.getElementById("generateButton");

    let previousIndex = 0;

    function chooseDish() {
      let nextIndex;

      do {
        nextIndex = Math.floor(Math.random() * dishes.length);
      } while (dishes.length > 1 && nextIndex === previousIndex);

      previousIndex = nextIndex;
      const dish = dishes[nextIndex];

      menuCard.classList.remove("changing");
      void menuCard.offsetWidth;
      menuCard.classList.add("changing");

      dishEmoji.textContent = dish.emoji;
      dishEmoji.setAttribute("aria-label", dish.name);
      dishName.textContent = dish.name;
      dishDescription.textContent = dish.description;
    }

    generateButton.addEventListener("click", chooseDish);
  </script>
</body>
</html>
